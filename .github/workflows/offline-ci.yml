name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      STRATEGY_PLATFORM_MODE: offline
      AGENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Unit, schema, quality and contract tests
        run: python -m pytest -q
      - name: Fake Agent E2E
        run: python scripts/run_v2_offline_e2e.py
      - name: Repository hygiene scan
        run: python -m tools.repository_check

  dashboard:
    runs-on: ubuntu-latest
    env:
      STRATEGY_PLATFORM_MODE: offline
      AGENT_PROVIDER: fake
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev
